<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./btvn2.css">
    <title>btvn2</title>
</head>
<body>
    <div class="card_course">
        <!-- Hinh anh khoa hoc -->
         <div class="background">
            <i class="fa-solid fa-code" style="color: #ffffff;"></i>
            <span class="tag">Bán chạy</span>
         </div>
         <!-- Thong tin khoa hoc -->
          <div class="course_info">
            <div class="review">
                <div class="tag">Lập trình</div>
                <div class="star">⭐4.9</div>
            </div>
            <h3 class="course_name">Lập trình Web Full Stack</h3>
            <p class="description">
                Học lập trình web từ cơ bản đến nâng cao với các công <br>nghệ hiện đại nhất
            </p>
            <div class="total">
                <time ><i class="fa-solid fa-clock"></i> 40 giờ</time>
                <span><i class="fa-solid fa-users"></i> 12K+ học viên</span>
            </div>
          </div>
          <!-- Duong ke -->
          <div class="diven"></div>
          <!-- footer -->
          <div class="footer">
                <strong class="price">2.990.000đ</strong>
                <button class="button">Xem chi tiết</button>
            </div>
    </div>
</body>
</html>
